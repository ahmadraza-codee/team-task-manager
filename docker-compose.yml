services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: team_task_manager }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment: { PORT: 5000, DATABASE_URL: postgresql://postgres:postgres@db:5432/team_task_manager, SESSION_SECRET: dev-secret-change-me, CLIENT_URL: http://localhost:5173 }
    ports: ["5000:5000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:8080"]
    depends_on: [backend]
volumes: { pgdata: {} }
